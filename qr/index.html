<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAU Debating Society Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#17201b;--mut:#66726b;--ac:#1b6b4a;--bar:#cfe5d8;--bd:#dfe5e0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#17201b;--tx:#e8efea;--mut:#93a39a;--ac:#5fd39b;--bar:#24412f;--bd:#27332c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif}
#go{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px;text-align:center}
.mark{width:72px;height:72px;margin-bottom:20px}
.mark circle{fill:none;stroke-width:3}
.mark .ring{stroke:var(--bd)}
.mark .arc{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:55 200;transform-origin:36px 36px;animation:sp 1.1s linear infinite}
.mark .dot{fill:var(--ac);stroke:none}
@keyframes sp{to{transform:rotate(360deg)}}
.name{font-size:1.35rem;font-weight:600;line-height:1.35;max-width:17em;text-wrap:balance;margin:0 0 8px}
.line{color:var(--mut);margin:0}
.bar{width:180px;height:3px;background:var(--bar);border-radius:2px;overflow:hidden;margin-top:22px}
.bar u{display:block;height:100%;width:0;background:var(--ac);animation:fill 1.6s ease-out forwards}
@keyframes fill{to{width:100%}}
#fb{margin:28px 0 0;font-size:.9rem;color:var(--mut);opacity:0;transition:opacity .3s}
#fb.show{opacity:1}
#fb a{color:var(--ac)}
@media(prefers-reduced-motion:reduce){.mark .arc{animation:none}.bar u{animation-duration:.01s}}
#dash{display:none;max-width:680px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:1.25rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px;font-size:.9rem}
.big{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:12px}
.big b{display:block;font-size:3.2rem;line-height:1;color:var(--ac);font-variant-numeric:tabular-nums}
.big span{color:var(--mut);font-size:.9rem}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mini{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.mini b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.mini span{color:var(--mut);font-size:.82rem}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:12px}
h2{font-size:.95rem;margin:0 0 10px}
.b{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:8px;font-size:.88rem;margin:6px 0}
.b i{display:block;height:10px;background:var(--bar);border-radius:5px;overflow:hidden}
.b i u{display:block;height:100%;background:var(--ac);text-decoration:none}
.b em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.b s{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.g{background:none;color:var(--mut);padding:4px 0;text-decoration:underline}
#msg{color:var(--mut);margin:12px 0}
</style>
</head>
<body>
<div id="go" role="status">
  <svg class="mark" viewBox="0 0 72 72" aria-hidden="true"><circle class="ring" cx="36" cy="36" r="30"/><circle class="arc" cx="36" cy="36" r="30"/><circle class="dot" cx="36" cy="36" r="5"/></svg>
  <p class="name">Sylhet Agricultural University Debating Society Form</p>
  <p class="line">ফর্মে নিয়ে যাওয়া হচ্ছে…</p>
  <div class="bar"><u></u></div>
  <p id="fb">নিজে থেকে না খুললে <a id="fl" href="#">এখানে চাপো</a></p>
</div>
<main id="dash">
  <h1>QR স্ক্যান ট্র্যাকার</h1>
  <p class="sub" id="who"></p>
  <div id="login"><button id="in">Google দিয়ে লগইন</button></div>
  <p id="msg"></p>
  <div id="out"></div>
  <button class="g" id="so" hidden>লগআউট</button>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,addDoc,serverTimestamp,query,orderBy,limit,getDocs} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* ====== শুধু এই অংশ বদলাও ====== */
const firebaseConfig = {
  apiKey: "AIzaSyD5Ee8qZulCbxGPa3w7UdgEwYscfb8pxck",
  authDomain: "aesthetic-sau.firebaseapp.com",
  projectId: "aesthetic-sau",
  appId: "1:584202645287:web:7893dd0af00cdb04d30302"
};
const TARGET = "https://forms.gle/sTZqeuPANMY8f8yW7";
/* ================================= */

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if (params.has('admin')) dashboard(); else track();

/* ---------- স্ক্যান গোনা + রিডাইরেক্ট ---------- */
async function track() {
  const t0 = Date.now();
  $('fl').href = TARGET;
  setTimeout(() => $('fb').classList.add('show'), 3000);
  const ua = navigator.userAgent;
  const device = /android/i.test(ua) ? 'Android' : /iphone|ipad|ipod/i.test(ua) ? 'iOS' : /windows|macintosh|linux/i.test(ua) ? 'Desktop' : 'Other';
  let first = true;
  try { first = !localStorage.getItem('qr_seen'); localStorage.setItem('qr_seen', '1'); } catch (e) {}
  const src = (params.get('src') || 'qr').slice(0, 30);
  try {
    await Promise.race([
      addDoc(collection(db, 'scans'), {t: serverTimestamp(), device, first, src}),
      new Promise(r => setTimeout(r, 1800))
    ]);
  } catch (e) {}
  const left = 1600 - (Date.now() - t0);
  if (left > 0) await new Promise(r => setTimeout(r, left));
  location.replace(TARGET);
}

/* ---------- ড্যাশবোর্ড ---------- */
function dashboard() {
  $('go').style.display = 'none';
  document.title = 'QR স্ক্যান ট্র্যাকার';
  $('dash').style.display = 'block';
  const auth = getAuth(app);
  $('in').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => $('msg').textContent = 'লগইন হয়নি: ' + e.code);
  $('so').onclick = () => signOut(auth);
  onAuthStateChanged(auth, async u => {
    $('login').hidden = !!u; $('so').hidden = !u; $('out').innerHTML = '';
    $('who').textContent = u ? u.email : '';
    if (!u) { $('msg').textContent = ''; return; }
    $('msg').textContent = 'লোড হচ্ছে…';
    try {
      const snap = await getDocs(query(collection(db, 'scans'), orderBy('t', 'desc'), limit(5000)));
      $('msg').textContent = '';
      render(snap.docs.map(d => { const x = d.data(); return {t: x.t ? x.t.toDate() : new Date(), device: x.device, first: x.first, src: x.src}; }));
    } catch (e) {
      $('msg').textContent = 'এই অ্যাকাউন্টে ডাটা দেখার অনুমতি নেই (firestore.rules এ ইমেইল ঠিক আছে?)';
    }
  });
}

function bars(map) {
  const e = Object.entries(map), max = Math.max(1, ...e.map(x => x[1]));
  return e.map(([k, v]) => `<div class="b"><s>${esc(k)}</s><i><u style="width:${v / max * 100}%"></u></i><em>${v}</em></div>`).join('') || '<span class="sub">এখনো কিছু নেই</span>';
}
function count(rows, key) { const m = {}; rows.forEach(r => m[r[key]] = (m[r[key]] || 0) + 1); return m; }

function render(rows) {
  const day = d => d.toLocaleDateString('en-CA');
  const today = day(new Date());
  const days = {};
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days[day(d).slice(5)] = 0; }
  rows.forEach(r => { const k = day(r.t).slice(5); if (k in days) days[k]++; });
  $('out').innerHTML = `
    <div class="big"><b>${rows.length}</b><span>মোট স্ক্যান</span></div>
    <div class="row3">
      <div class="mini"><b>${rows.filter(r => day(r.t) === today).length}</b><span>আজকে</span></div>
      <div class="mini"><b>${rows.filter(r => r.first).length}</b><span>আনুমানিক আলাদা ডিভাইস</span></div>
    </div>
    <section><h2>গত ৭ দিন</h2>${bars(days)}</section>
    <section><h2>ডিভাইস</h2>${bars(count(rows, 'device'))}</section>
    <section><h2>QR এর উৎস (?src=)</h2>${bars(count(rows, 'src'))}</section>`;
}
</script>
</body>
</html>

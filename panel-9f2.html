<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic SAU — Admin / Responses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12161f; --ink-2:#191f2b; --ink-3:#1f2635;
    --paper:#f3ecdd; --paper-dim:#c9c2b2;
    --brass:#4fae32; --brass-bright:#7ed957;
    --stamp:#b3432b; --slate:#8892a6; --line: rgba(243,236,221,0.14);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ink); color:var(--paper);
    font-family:'Inter',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--brass-bright);}
  .wrap{ max-width:1100px; margin:0 auto; padding:28px 20px 80px; }

  /* ---------- gate ---------- */
  .gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .gate-card{
    background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:34px 28px; max-width:360px; width:100%; text-align:center;
  }
  .gate-eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--brass-bright); margin-bottom:10px;
  }
  .gate-title{ font-family:'Fraunces', serif; font-weight:700; font-size:24px; margin-bottom:18px; }
  .gate-card input{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--paper);
    border-radius:9px; padding:12px 13px; font-size:15px; text-align:center;
    letter-spacing:0.08em; outline:none;
  }
  .gate-card input:focus{ border-color:var(--brass); }
  .pw-wrap{ position:relative; margin-bottom:12px; }
  .pw-wrap input{ margin-bottom:0; padding-right:42px; }
  .pw-toggle{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:30px; height:30px; border:none; background:transparent; cursor:pointer;
    color:var(--slate); display:flex; align-items:center; justify-content:center;
    border-radius:6px;
  }
  .pw-toggle:hover{ color:var(--paper); background:rgba(243,236,221,0.06); }
  .gate-err{ color:var(--stamp); font-size:12.5px; margin-bottom:10px; display:none; }
  .gate-err.show{ display:block; }
  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    padding:12px 20px; border-radius:9px; border:none; cursor:pointer; width:100%;
    background:var(--brass-bright); color:var(--ink);
  }
  .btn:active{ transform:scale(0.98); }
  .btn-small{ width:auto; padding:8px 14px; font-size:13px; }
  .btn-ghost{ background:transparent; color:var(--paper-dim); border:1px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--brass); color:var(--paper); }

  /* ---------- dashboard ---------- */
  .masthead{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    margin-bottom:20px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:16px;
  }
  .masthead-title{ font-family:'Fraunces', serif; font-weight:700; font-size:clamp(24px,4vw,34px); }
  .masthead-title em{ font-style:italic; font-weight:500; color:var(--brass-bright); }
  .masthead-sub{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--slate); }
  .masthead-brand{ display:flex; align-items:center; gap:12px; }
  .masthead-logo{ width:38px; height:38px; flex:none; filter: drop-shadow(0 0 10px rgba(126,217,87,0.25)); }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
  .toolbar input[type=text]{
    flex:1; min-width:200px; background:var(--ink-2); border:1px solid var(--line); color:var(--paper);
    border-radius:9px; padding:10px 13px; font-size:14px; outline:none;
  }
  .toolbar input:focus{ border-color:var(--brass); }
  .toolbar select{
    background:var(--ink-2); border:1px solid var(--line); color:var(--paper);
    border-radius:9px; padding:10px 13px; font-size:13.5px; outline:none;
  }

  .stats-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
  .stat{
    background:var(--ink-2); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; min-width:110px;
  }
  .stat .num{ font-family:'Fraunces', serif; font-size:22px; font-weight:700; color:var(--brass-bright); }
  .stat .lbl{ font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--slate); margin-top:2px; }

  .empty{ color:var(--slate); text-align:center; padding:60px 10px; font-size:14px; }

  .resp-list{ display:flex; flex-direction:column; gap:10px; }
  .resp-card{
    background:var(--ink-2); border:1px solid var(--line); border-radius:12px;
    overflow:hidden;
  }
  .resp-head{
    display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer;
  }
  .resp-photo{
    width:44px; height:44px; border-radius:9px; flex:none; overflow:hidden;
    background:linear-gradient(155deg, var(--brass), #8f6a26);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:700; color:var(--ink); font-size:17px;
  }
  .resp-photo img{ width:100%; height:100%; object-fit:cover; }
  .resp-main{ flex:1; min-width:0; }
  .resp-name{ font-family:'Fraunces', serif; font-weight:600; font-size:16.5px; }
  .resp-meta{ font-size:12px; color:var(--slate); margin-top:2px; }
  .resp-meta span{ color:var(--paper-dim); }
  .resp-time{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--slate); white-space:nowrap; }
  .chev{ color:var(--slate); transition:transform .2s ease; flex:none; }
  .resp-card.open .chev{ transform:rotate(90deg); }

  .resp-body{ display:none; padding:0 16px 18px; border-top:1px solid var(--line); }
  .resp-card.open .resp-body{ display:block; }
  .qa{ margin-top:14px; }
  .qa .q{ font-size:11.5px; letter-spacing:0.03em; color:var(--brass-bright); font-family:'JetBrains Mono', monospace; margin-bottom:4px; }
  .qa .a{ font-size:14px; line-height:1.55; color:var(--paper); white-space:pre-wrap; }
  .qa .a.empty-a{ color:var(--slate); font-style:italic; }
  .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .tag{
    font-size:11.5px; background:rgba(79,174,50,0.14); border:1px solid rgba(79,174,50,0.4);
    color:var(--brass-bright); padding:3px 9px; border-radius:100px;
  }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px){ .grid2{ grid-template-columns:1fr; } }

  .top-actions{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px; flex-wrap:wrap;}

  .hidden{ display:none !important; }
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-eyebrow">Aesthetic SAU — Press Desk</div>
    <div class="gate-title">Admin Access</div>
    <div class="pw-wrap">
      <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
      <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="gate-err" id="pwErr">ভুল password, আবার চেষ্টা করো।</div>
    <button class="btn" id="pwSubmit">Enter</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD5Ee8qZulCbxGPa3w7UdgEwYscfb8pxck",
    authDomain: "aesthetic-sau.firebaseapp.com",
    databaseURL: "https://aesthetic-sau-default-rtdb.firebaseio.com",
    projectId: "aesthetic-sau",
    storageBucket: "aesthetic-sau.firebasestorage.app",
    messagingSenderId: "584202645287",
    appId: "1:584202645287:web:7893dd0af00cdb04d30302",
    measurementId: "G-L3FF1NTLL1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const adminLogin = (email, password) => signInWithEmailAndPassword(auth, email, password);
  const adminLogout = () => signOut(auth);

  const fetchResponses = async () => {
    const q = query(collection(db, "sau_campus_rep_2026"), orderBy("submittedAt","desc"));
    const snap = await getDocs(q);
    return snap.docs.map(d=>({ id:d.id, ...d.data() }));
  };

  // TODO: this must match the admin account you create in
  // Firebase Console → Authentication → Users (Email/Password provider)
  const ADMIN_EMAIL = "aestheticsau3100@gmail.com";

  const gate = document.getElementById('gate');
  const dashboard = document.getElementById('dashboard');
  const pwInput = document.getElementById('pwInput');
  const pwErr = document.getElementById('pwErr');

  const pwToggle = document.getElementById('pwToggle');
  const eyeIcon = document.getElementById('eyeIcon');
  const EYE_OPEN = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
  const EYE_OFF = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a20.3 20.3 0 0 1-2.68 3.68M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  pwToggle.addEventListener('click', ()=>{
    const showing = pwInput.type === 'text';
    pwInput.type = showing ? 'password' : 'text';
    eyeIcon.innerHTML = showing ? EYE_OPEN : EYE_OFF;
    pwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    pwInput.focus();
  });

  function unlock(){
    gate.classList.add('hidden');
    dashboard.classList.remove('hidden');
    loadResponses();
  }
  function lock(){
    dashboard.classList.add('hidden');
    gate.classList.remove('hidden');
    pwInput.value = '';
  }

  onAuthStateChanged(auth, (user)=>{
    if(user && user.email === ADMIN_EMAIL){ unlock(); }
    else { lock(); }
  });

  document.getElementById('pwSubmit').addEventListener('click', tryLogin);
  pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });

  async function tryLogin(){
    pwErr.classList.remove('show');
    const submitBtn = document.getElementById('pwSubmit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Checking...';
    try{
      await adminLogin(ADMIN_EMAIL, pwInput.value);
      // onAuthStateChanged listener above calls unlock()
    } catch(e){
      console.error(e);
      pwErr.textContent = 'ভুল password, আবার চেষ্টা করো। (' + (e.code || e.message) + ')';
      pwErr.classList.add('show');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enter';
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    adminLogout();
  });

  let allResponses = [];

  function fmtTime(ts){
    try{
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
    }catch(e){ return ''; }
  }

  function renderStats(list){
    const total = list.length;
    const withPhoto = list.filter(r=>r.photoUrl).length;
    const withExp = list.filter(r=>r.prevExp === 'Yes').length;
    const faculties = new Set(list.map(r=>r.faculty).filter(Boolean)).size;
    document.getElementById('statsRow').innerHTML = `
      <div class="stat"><div class="num">${total}</div><div class="lbl">Applications</div></div>
      <div class="stat"><div class="num">${withExp}</div><div class="lbl">With Experience</div></div>
      <div class="stat"><div class="num">${withPhoto}</div><div class="lbl">With Photo</div></div>
      <div class="stat"><div class="num">${faculties}</div><div class="lbl">Faculties</div></div>
    `;
  }

  function esc(s){ return (s||'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function qa(label, value){
    const has = value && value.toString().trim();
    return `<div class="qa"><div class="q">${label}</div><div class="a ${has?'':'empty-a'}">${has ? esc(value) : '— খালি —'}</div></div>`;
  }

  function renderCard(r){
    const initial = (r.fullName||'?').trim()[0]?.toUpperCase() || '?';
    const photo = r.photoUrl ? `<img src="${r.photoUrl}" alt="">` : initial;
    const skills = (r.skills||[]).concat(r.skillOther ? [r.skillOther] : []);
    return `
    <div class="resp-card" data-id="${r.id}">
      <div class="resp-head">
        <div class="resp-photo">${photo}</div>
        <div class="resp-main">
          <div class="resp-name">${esc(r.fullName)||'(No name)'} ${r.nickName?`<span style="color:var(--slate); font-weight:400; font-size:13px;">· ${esc(r.nickName)}</span>`:''}</div>
          <div class="resp-meta"><span>${esc(r.faculty)||'—'}</span> · ID ${esc(r.studentId)||'—'} · ${esc(r.levelSem)||'—'} · ${esc(r.hall)||'—'}</div>
        </div>
        <div class="resp-time">${fmtTime(r.submittedAt)}</div>
        <div class="chev">▶</div>
      </div>
      <div class="resp-body">
        <div class="grid2">
          ${qa('Phone', r.phone)}
          ${qa('Facebook', r.fbLink)}
        </div>
        <div class="qa"><div class="q">Skills</div><div class="tags">${skills.length ? skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('') : '<span class="a empty-a">— খালি —</span>'}</div></div>
        ${qa('Campus activity level', r.activeLevel)}
        ${qa('Previous experience', r.prevExp === 'Yes' ? (r.prevExpText || 'Yes') : (r.prevExp || '—'))}
        ${qa('Why join Aesthetic SAU', r.whyJoin)}
        ${qa('What they can contribute', r.contribute)}
        ${qa('Practical task — reporting a campus event', r.taskReport)}
        ${qa('Practical task — one content idea', r.taskIdea)}
        <div class="grid2">
          ${qa('Time commitment', r.timeCommit)}
          ${qa('Willing to cover events', r.willingCover)}
        </div>
        ${qa('Portfolio link', r.portfolioLink)}
        ${qa('Why select them', r.whySelect)}
        ${qa('Agrees to guidelines', r.agreeGuidelines)}
        ${qa('Anything else', r.anythingElse)}
      </div>
    </div>`;
  }

  function applyFilters(){
    const term = document.getElementById('searchBox').value.trim().toLowerCase();
    const sort = document.getElementById('sortSelect').value;
    let list = allResponses.filter(r=>{
      if(!term) return true;
      const hay = [r.fullName, r.nickName, r.studentId, r.faculty, r.hall, ...(r.skills||[]), r.skillOther]
        .filter(Boolean).join(' ').toLowerCase();
      return hay.includes(term);
    });
    if(sort==='name') list = list.slice().sort((a,b)=>(a.fullName||'').localeCompare(b.fullName||''));
    if(sort==='old') list = list.slice().reverse();
    renderList(list);
    renderStats(list);
  }

  function renderList(list){
    const respList = document.getElementById('respList');
    document.getElementById('emptyState').classList.toggle('hidden', list.length>0);
    respList.innerHTML = list.map(renderCard).join('');
    respList.querySelectorAll('.resp-head').forEach(head=>{
      head.addEventListener('click', ()=> head.closest('.resp-card').classList.toggle('open'));
    });
  }

  document.getElementById('searchBox').addEventListener('input', applyFilters);
  document.getElementById('sortSelect').addEventListener('change', applyFilters);

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const cols = ['fullName','nickName','studentId','faculty','levelSem','hall','phone','fbLink',
      'activeLevel','skills','skillOther','prevExp','prevExpText','whyJoin','contribute',
      'taskReport','taskIdea','timeCommit','willingCover','portfolioLink','whySelect',
      'agreeGuidelines','anythingElse','photoUrl'];
    const rows = [cols.join(',')];
    allResponses.forEach(r=>{
      const row = cols.map(c=>{
        let v = r[c];
        if(Array.isArray(v)) v = v.join('; ');
        v = (v===undefined || v===null) ? '' : v.toString();
        return `"${v.replace(/"/g,'""')}"`;
      });
      rows.push(row.join(','));
    });
    const blob = new Blob([rows.join('\n')], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'aesthetic_sau_campus_rep_responses.csv';
    a.click();
    URL.revokeObjectURL(url);
  });

  async function loadResponses(){
    const respList = document.getElementById('respList');
    respList.innerHTML = '';
    try{
      allResponses = await fetchResponses();
      applyFilters();
    }catch(e){
      console.error(e);
      document.getElementById('emptyState').classList.remove('hidden');
      document.getElementById('emptyState').textContent = 'Data লোড করতে সমস্যা হয়েছে: ' + (e.code || e.message);
    }
  }
</script>

</body>
</html>

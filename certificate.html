<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aesthetic SAU — Certificate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0b1220;
    color: #1a1a1a;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Outer wrapper handles centering + scaling, so the certificate ALWAYS
     renders at a fixed "desktop" layout (960x680) and is scaled down to
     fit narrow/mobile screens — never reflows, never overlaps. */
  .stage {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 0;
  }

  .scale-wrap {
    width: 960px;
    flex-shrink: 0;
  }

  .certificate {
    width: 960px;
    height: 680px;
    background: linear-gradient(145deg, #fdfdf8 0%, #f5f3ea 100%);
    border-radius: 6px;
    position: relative;
    padding: 50px 60px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    border: 2px solid #1c5e3c;
    overflow: hidden;
  }

  .certificate::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1.5px solid #c9a227;
    border-radius: 4px;
    pointer-events: none;
  }

  .corner {
    position: absolute;
    width: 70px;
    height: 70px;
    border: 3px solid #c9a227;
    opacity: 0.7;
  }
  .corner.tl { top: 22px; left: 22px; border-right: none; border-bottom: none; }
  .corner.tr { top: 22px; right: 22px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 22px; left: 22px; border-right: none; border-top: none; }
  .corner.br { bottom: 22px; right: 22px; border-left: none; border-top: none; }

  .header { text-align: center; margin-bottom: 6px; }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .brand img { height: 40px; width: 40px; border-radius: 50%; object-fit: cover; margin-right: 6px; vertical-align: middle; }
  .brand-name {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 22px;
    color: #1c5e3c;
    letter-spacing: 0.5px;
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: 38px;
    font-weight: 800;
    color: #16331f;
    text-align: center;
    margin: 4px 0 2px;
    letter-spacing: 1px;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    letter-spacing: 3px;
    color: #8a7a3f;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .presented { text-align: center; font-size: 14px; color: #555; margin-bottom: 6px; }

  .winner-name-wrap { text-align: center; }
  .winner-name {
    display: inline-block;
    font-family: 'Playfair Display', serif;
    font-size: 44px;
    font-weight: 700;
    color: #0d2818;
    margin: 8px 0;
    border-bottom: 2px solid #c9a227;
    padding-bottom: 8px;
    max-width: 820px;
    white-space: nowrap;
  }

  .meta { text-align: center; font-size: 14px; color: #555; margin-top: 10px; line-height: 1.7; }
  .prize-line {
    text-align: center;
    margin-top: 14px;
    font-size: 19px;
    font-weight: 700;
    color: #a8791b;
    letter-spacing: 0.5px;
  }

  .footer {
    position: absolute;
    bottom: 50px;
    left: 60px;
    right: 60px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .sign-block { text-align: center; width: 220px; }
  .sign-line { border-top: 1.5px solid #444; margin-bottom: 6px; }
  .sign-label { font-size: 12px; color: #555; }
  .seal {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    border: 3px double #c9a227;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .seal img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }

  .id-tag {
    position: absolute;
    bottom: 14px;
    right: 24px;
    font-size: 9px;
    color: #aaa;
    letter-spacing: 1px;
  }

  .print-bar {
    width: 960px;
    text-align: center;
    margin-top: 18px;
  }
  .print-bar button {
    background: #1c5e3c;
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .not-found { color: white; text-align: center; font-family: 'Inter', sans-serif; padding: 60px 20px; }

  @media print {
    body { background: white; }
    .stage { padding: 0; }
    .print-bar { display: none; }
    .scale-wrap { transform: none !important; }
    .certificate { box-shadow: none; }
  }
</style>
</head>

      wrap.style.transformOrigin = 'top center';
      // Reserve correct space so layout below isn't cut off
      wrap.style.marginBottom = (680 * scale - 680) + 'px';
      document.getElementById('printBar').style.display = 'block';
    }
    window.addEventListener('resize', fitToScreen);
    window.addEventListener('orientationchange', fitToScreen);
    fitToScreen();
  }
</script>

</body>
</html>
